<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Cadastro dos gatos - Meowson</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="barra">
    <a href="index.html">Meowson</a>
    <nav aria-label="Principal">
        <a href="cadastro.html">Cadastro</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<div class="container">
<form method="post" enctype="multipart/form-data" action="cadastrar_gato.php">

<div class="campo">
<label for="nome">Nome</label>
<input required name="nome" type="text" minlength="1" maxlength="50" id="nome">
</div>

<div class="campo">
<label for="raca">Raça</label>
<input required name="raca" type="text" maxlength="30" id="raca">
</div>

<div class="campo">
<label for="idade">Idade (em meses)</label>
<input required name="idade" type="number" id="idade">
</div>

<div class="campo">
<label for="sexo">Sexo</label>
<select name="sexo" id="sexo" required>
<option selected value="">Escolha uma opção</option>
<option value="F">F</option>
<option value="M">M</option>
</select>
</div>

<div class="campo">
<label for="descricao">Descrição (opcional)</label>
<textarea name="descricao" id="descricao"></textarea>
</div>

<div class="campo">
<label for="observacoes">Observações (opcional)</label>
<textarea name="observacoes" id="observacoes"></textarea>
</div>

<div class="campo">
<label for="vacinas">Vacinas (opcional)</label>
<textarea name="vacinas" id="vacinas"></textarea>
</div>

<div class="campo">
<label for="doencas">Doenças (opcional)</label>
<textarea name="doencas" id="doencas"></textarea>
</div>

<div class="campo">
<label for="fotos">Fotos</label>
<input type="file" name="fotos[]" multiple required id="fotos">
</div>

<button class="botao" type="submit" name="botao">Enviar</button>
</form>
</div>
</body>
</html>
