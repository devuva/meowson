<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Cadastro - Meowson</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
</head>
<body>

<header class="barra">
   <a href="gatos.php" class="marca">
    <img src="img/logo.svg" alt="Logo Meowson">
    <span>Meowson</span>
</a>
    <nav aria-label="Principal">
        <a href="gatos.php">Adotar</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<div class="container container-cadastro">
    <h1>Criar conta</h1>
    <p class="subtitulo-form">Preencha seus dados para adotar um gato ou cadastrar animais como protetor independente ou ONG.</p>

    <form method="post" enctype="multipart/form-data" action="cadastrar.php" class="form-card">
        <fieldset>
            <legend>Dados Pessoais e Acesso</legend>

            <div class="grid-cadastro">
                <div class="campo col-cheia">
                    <label for="nome">Nome completo ou Razão Social</label>
                    <input maxlength="150" id="nome" name="nome" required autocomplete="name">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input maxlength="150" type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone / WhatsApp</label>
                    <input maxlength="15" type="tel" id="telefone" name="telefone" required autocomplete="tel">
                </div>

                <div class="campo">
                    <label for="senha">Senha (mínimo 8 caracteres)</label>
                    <input minlength="8" maxlength="72" type="password" id="senha" name="senha" required autocomplete="new-password">
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input minlength="8" maxlength="72" type="password" id="confirmarSenha" name="confirmarSenha" required autocomplete="new-password">
                </div>

                <div class="campo">
                    <label for="perfil">Perfil</label>
                    <select name="perfil" id="perfil" required>
                        <option selected value="">Selecione um perfil</option>
                        <option value="adotante">Adotante</option>
                        <option value="protetor">Protetor</option>
                        <option value="ong">ONG</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input maxlength="18" id="cpf" name="cpf_cnpj" required inputmode="numeric">
                </div>

                <div id="bloco-documento" class="col-cheia" hidden>
                    <div class="campo">
                        <label for="documento">Documentação da ONG (Estatuto ou Comprovante CNPJ)</label>
                        <input type="file" id="documento" name="documento">
                    </div>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Endereço</legend>

            <div class="grid-cadastro">
                <div class="campo">
                    <label for="cep">CEP</label>
                    <input maxlength="9" id="cep" name="cep" required inputmode="numeric" autocomplete="postal-code">
                </div>

                <div class="campo">
                    <label for="logradouro">Logradouro</label>
                    <input maxlength="100" id="logradouro" name="logradouro" required autocomplete="address-line1">
                </div>

                <div class="campo">
                    <label for="numero">Número</label>
                    <input maxlength="10" id="numero" name="numero" required>
                </div>

                <div class="campo">
                    <label for="bairro">Bairro</label>
                    <input maxlength="50" id="bairro" name="bairro" required>
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input maxlength="50" id="cidade" name="cidade" required autocomplete="address-level2">
                </div>

                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione um estado</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                </div>

                <div class="campo col-cheia">
                    <label for="complemento">Complemento</label>
                    <input maxlength="50" id="complemento" name="complemento">
                </div>
            </div>
        </fieldset>

        <button type="submit" id="botao" class="botao">Cadastrar</button>

        <p class="texto-auxiliar">Já possui conta? <a href="login.html">Entrar</a></p>
    </form>
</div>
<script src="js/app.js"></script>
</body>
</html>
